<div class="container">
    <div class="sections">
    <p>Detalles del evento ></p> <p>Espacios ></p> <p class="selected">Consumo ></p> <p>Confirmar datos ></p> <p>Pagar</p>
</div>

<div class="content">
  <div class="details">
        <div class="title">
            <h1>{{ name }}</h1>
            <h3>Selecciona lo que vas a consumir</h3>
        </div>

        <div class="list">
            <p-tabs value="0">
                <p-tablist>
                    <p-tab value="0">Bebidas</p-tab>
                </p-tablist>
                <p-tabpanels>

                    <p-tabpanel value="0" *ngIf="drinks$ | async as drinks">
                        <div class="grid">
                            <div class="card2" *ngFor="let drink of drinks">
                                <div class="cardImg">
                                    <img class="imgCard" [src]="apiImg + '/' + drink.image" >
                                </div>

                                <div class="cardInfo">
                                    <h3>{{ drink.description }}</h3>
                                    <h4>{{ drink.price }}$</h4>
                                </div>
                                <div class="cardBtn">
                                    <button class="btn1">Agregar</button>
                                </div>
                            </div>
                        </div>
                    </p-tabpanel>
                </p-tabpanels>
            </p-tabs>
        </div>
   

    
        <div class="btnDetails">
            <button class="btn2" routerLink="/home/event/ticket/consume/checkout">Continuar</button>
        </div>
  </div>
  
</div>
</div>
