<div class="container">
    <div class="table">
        <div class="title">
            <h1>Configuración</h1>
            <p>Actualiza los parámetros de configuración</p>
        </div>

        <form [formGroup]="updateSettingsForm" (ngSubmit)="onSubmit()" class="form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input pInputText name="email" type="text" id="email" formControlName="email" class="form-control">
            </div>

            <div class="form-group">
                <label for="instagram">Instagram</label>
                <input pInputText name="instagram" type="text" id="instagram" formControlName="instagram" class="form-control">
            </div>

            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input pInputText type="number" (input)="onlyNumberInput($event)" id="phone" formControlName="phone" class="form-control">
            </div>
            

            <div class="form-group">
                <label for="tasaDolar">Tasa Dólar</label>
                <input pInputText type="number" (input)="onlyNumberInput($event)" id="tasaDolar" formControlName="tasaDolar" class="form-control">
            </div>
            

            <div class="form-group">
                <label for="bcv">BCV</label>
                <input pInputText type="number" id="bcv" (input)="onlyNumberInput($event)" formControlName="BCV" class="form-control">
            </div>

            <button type="submit" class="p-button-success">Actualizar</button>
        </form>
    </div>
</div>
